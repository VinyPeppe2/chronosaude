<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ChronoSaúde</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════
   DESIGN TOKENS — DARK / LIGHT
══════════════════════════════════════════════════════════ */
:root{
  --bg:#06090f; --surf:#0c1118; --card:#101820; --card2:#141f2a;
  --border:#1a2535; --border2:#1f2e40;
  --g1:#00e5b8; --g2:#0ea5e9; --warn:#f59e0b; --danger:#ef4444;
  --purple:#a78bfa; --pink:#f472b6; --green:#22c55e;
  --text:#dde8f5; --muted:#4d6680; --muted2:#2d4560;
  --font-hd:'Syne',sans-serif; --font-ui:'Instrument Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 16px 64px rgba(0,0,0,.5);
  --r:12px; --r-sm:8px;
  --transition:.2s ease;
}
[data-theme="light"]{
  --bg:#f0f5fb; --surf:#ffffff; --card:#ffffff; --card2:#f8fafc;
  --border:#d1dce8; --border2:#c3d0e0;
  --text:#1a2535; --muted:#6b7f96; --muted2:#a0b0c0;
  --shadow:0 4px 24px rgba(0,0,0,.08);
  --shadow-lg:0 16px 64px rgba(0,0,0,.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(0,229,184,.5)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.1)}70%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(0,229,184,.4)}50%{box-shadow:0 0 24px rgba(0,229,184,.8)}}
.fade-up{animation:fadeUp .4s ease both}
.pulse-dot{animation:pulse 1.4s ease infinite}

/* ══ LAYOUT ══════════════════════════════════════════════ */
#app{display:flex;flex-direction:column;min-height:100vh}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(6,9,15,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:62px;gap:12px;
  transition:background .3s,border .3s;
}
[data-theme="light"] header{background:rgba(240,245,251,.9)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;animation:ring 3s infinite;flex-shrink:0}
.logo-text{font-family:var(--font-hd);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--text)}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* Header actions */
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:all var(--transition);flex-shrink:0;
}
.icon-btn:hover{border-color:var(--g1);transform:scale(1.05)}
.icon-btn.active{background:rgba(0,229,184,.12);border-color:rgba(0,229,184,.4)}
.clock-pill{font-family:var(--font-mono);font-size:12px;color:var(--g1);background:rgba(0,229,184,.08);padding:5px 11px;border-radius:7px;border:1px solid rgba(0,229,184,.18);letter-spacing:.04em;white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer;transition:border var(--transition)}
.user-chip:hover{border-color:var(--g1)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;font-family:var(--font-hd)}
.user-name{font-size:13px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Voice wave indicator */
.voice-wave{display:flex;align-items:center;gap:2px;height:18px}
.voice-wave span{width:3px;border-radius:3px;background:var(--g1);animation:wave .7s ease infinite}
.voice-wave span:nth-child(2){animation-delay:.1s;height:10px}
.voice-wave span:nth-child(3){animation-delay:.2s;height:16px}
.voice-wave span:nth-child(4){animation-delay:.1s;height:10px}
.voice-wave span:nth-child(1){height:6px}

/* ── Patient bar ── */
#patient-bar{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;
  transition:background .3s;
}
.pinfo{display:flex;flex-direction:column;gap:1px}
.pinfo-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pinfo-val{font-size:12px;font-weight:500}
.pinfo-val.hi{color:var(--g1);font-family:var(--font-mono)}
.watch-pill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;margin-left:auto;cursor:pointer;transition:all var(--transition)}
.watch-pill:hover{border-color:var(--g1)}

/* ── Nav ── */
nav{background:var(--surf);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:2px;overflow-x:auto;transition:background .3s}
nav::-webkit-scrollbar{height:0}
.tab-btn{background:none;border:none;font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--muted);padding:12px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--transition);display:flex;align-items:center;gap:5px}
.tab-btn.active{color:var(--g1);border-bottom-color:var(--g1)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-badge{background:var(--danger);color:#fff;border-radius:10px;font-size:9px;font-weight:700;padding:1px 5px;line-height:1.4}

/* ── Main ── */
main{flex:1;padding:20px 24px;max-width:1360px;width:100%;margin:0 auto}

/* ══ COMPONENTS ═══════════════════════════════════════════ */

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;animation:fadeUp .35s ease both;transition:background .3s,border .3s,box-shadow .2s}
.card:hover{box-shadow:var(--shadow)}
.card-title{font-family:var(--font-hd);font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px}

/* Grids */
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.g2-fixed{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flex-col{display:flex;flex-direction:column;gap:14px}

/* Section headers */
.sec{font-family:var(--font-hd);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* Stat card */
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:7px;animation:fadeUp .35s ease both;position:relative;overflow:hidden;transition:all var(--transition)}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ac,transparent),transparent 60%);opacity:.07;pointer-events:none}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-icon{font-size:22px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat-val{font-family:var(--font-hd);font-size:28px;font-weight:800;line-height:1;color:var(--ac,var(--text))}
.stat-sub{font-size:11px;color:var(--muted)}

/* Vital card */
.vital-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:9px;animation:fadeUp .35s ease both;transition:all var(--transition)}
.vital-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.b-ok{background:rgba(0,229,184,.12);color:var(--g1);border:1px solid rgba(0,229,184,.2)}
.b-warn{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.2)}
.b-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.b-blue{background:rgba(14,165,233,.12);color:var(--g2);border:1px solid rgba(14,165,233,.2)}
.b-purple{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.b-green{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;border-radius:var(--r-sm);font-family:var(--font-ui);font-weight:500;transition:all var(--transition)}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:#000;padding:8px 16px;font-size:13px;font-weight:600}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,229,184,.3)}
.btn-ghost{background:transparent;color:var(--muted);padding:7px 13px;font-size:12px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--g1);color:var(--g1)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);padding:6px 12px;font-size:12px;border:1px solid rgba(239,68,68,.25)}
.btn-sm{padding:5px 11px;font-size:12px}

/* Inputs */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input,select,textarea{background:var(--surf);border:1px solid var(--border2);color:var(--text);border-radius:var(--r-sm);padding:9px 12px;font-family:var(--font-ui);font-size:13px;outline:none;transition:all var(--transition);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(0,229,184,.1)}
select option{background:var(--surf);color:var(--text)}

/* Progress */
.prog-wrap{background:var(--surf);border-radius:6px;height:7px;overflow:hidden}
.prog-bar{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.16,1,.3,1)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,229,184,.03)}

/* Toast */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
.toast{pointer-events:all;display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;animation:slideIn .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.3);max-width:320px}
.toast-ok{background:rgba(0,229,184,.95);color:#000}
.toast-warn{background:rgba(245,158,11,.95);color:#000}
.toast-danger{background:rgba(239,68,68,.95);color:#fff}
.toast-info{background:rgba(14,165,233,.95);color:#fff}

/* Med item */
.med-item{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:10px;padding:11px 14px;border:1px solid var(--border);transition:all var(--transition)}
.med-item:hover{border-color:var(--border2)}
.med-item.taken{border-color:rgba(0,229,184,.3);background:rgba(0,229,184,.04)}
.med-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.med-info{flex:1}
.med-name{font-size:13px;font-weight:600}
.med-detail{font-size:11px;color:var(--muted);margin-top:1px}

/* Alert item */
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surf);transition:all var(--transition)}
.alert-item:hover{border-color:var(--border2)}

/* Watch face */
.watch-face{width:155px;height:175px;background:var(--card2);border-radius:30px;border:2px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;flex-shrink:0;box-shadow:0 0 30px rgba(0,229,184,.08),inset 0 0 30px rgba(0,0,0,.1)}
.watch-face::before{content:'';position:absolute;top:-6px;width:38px;height:7px;background:var(--card2);border:2px solid var(--border2);border-radius:4px}
.watch-hr{font-family:var(--font-hd);font-size:34px;font-weight:800;color:var(--g1);line-height:1;animation:hb 1.4s ease infinite}
.watch-status{width:6px;height:6px;border-radius:50%;background:var(--g1);animation:pulse 1.2s infinite;position:absolute;top:13px;right:14px}

/* Symptom */
.symp-item{display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--surf);border-radius:10px;border:1px solid var(--border);transition:all var(--transition)}
.symp-score{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-weight:800;font-size:15px;flex-shrink:0}

/* Chart */
.chart-wrap{position:relative;width:100%;height:130px}
.chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}

/* ── Water tracker ── */
.water-cups{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cup{width:38px;height:44px;border-radius:6px 6px 9px 9px;border:2px solid var(--border2);cursor:pointer;transition:all .15s;display:flex;align-items:flex-end;overflow:hidden;position:relative}
.cup.filled{border-color:var(--g2)}
.cup-water{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(14,165,233,.6),rgba(14,165,233,.9));transition:height .3s cubic-bezier(.16,1,.3,1)}
.cup:hover{transform:scale(1.1)}
.cup-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:1}

/* ── Mood ── */
.mood-grid{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{width:48px;height:48px;border-radius:12px;border:2px solid var(--border);background:var(--surf);cursor:pointer;font-size:24px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.mood-btn:hover{transform:scale(1.12);border-color:var(--g1)}
.mood-btn.selected{border-color:var(--g1);background:rgba(0,229,184,.1);animation:glow 1.5s ease infinite}

/* ── BMI ── */
.bmi-bar{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--g2),var(--g1),var(--warn),var(--danger));position:relative;margin:10px 0}
.bmi-arrow{position:absolute;top:-4px;transform:translateX(-50%);font-size:20px;transition:left .5s cubic-bezier(.16,1,.3,1)}

/* ── Emergency ── */
.emergency-btn{
  width:100%;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;
  border:none;border-radius:12px;padding:16px;font-family:var(--font-hd);
  font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:10px;transition:all .2s;
  box-shadow:0 4px 20px rgba(239,68,68,.3);
}
.emergency-btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 8px 32px rgba(239,68,68,.5)}
.emergency-btn:active{transform:scale(.98)}

/* ── Stock pills ── */
.stock-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.stock-item:last-child{border:none}

/* ── Connect screen ── */
.watch-connect{display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 20px;text-align:center}
.watch-ring{width:110px;height:110px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;position:relative;font-size:44px}
.watch-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--g1);border-top-color:transparent;animation:spin 1.4s linear infinite}

/* Appointment */
.appt-item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surf);border-radius:10px;border:1px solid var(--border);transition:all var(--transition)}
.appt-date{width:50px;height:50px;border-radius:10px;background:rgba(0,229,184,.1);border:1px solid rgba(0,229,184,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.appt-day{font-family:var(--font-hd);font-size:20px;font-weight:800;color:var(--g1);line-height:1}
.appt-month{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}

/* ── Voice modal ── */
#voice-modal{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid rgba(0,229,184,.3);
  border-radius:16px;padding:14px 20px;z-index:300;
  display:none;align-items:center;gap:14px;min-width:260px;
  box-shadow:0 16px 48px rgba(0,0,0,.4);
  animation:fadeUp .3s ease both;
}
#voice-modal.show{display:flex}
.vm-wave{display:flex;align-items:center;gap:3px;height:24px}
.vm-wave span{width:4px;border-radius:4px;background:var(--g1)}
.vm-wave span:nth-child(1){height:8px;animation:wave .7s ease infinite}
.vm-wave span:nth-child(2){height:18px;animation:wave .7s .1s ease infinite}
.vm-wave span:nth-child(3){height:24px;animation:wave .7s .2s ease infinite}
.vm-wave span:nth-child(4){height:18px;animation:wave .7s .1s ease infinite}
.vm-wave span:nth-child(5){height:8px;animation:wave .7s ease infinite}

/* Responsive */
@media(max-width:640px){
  main{padding:14px 16px}
  header{padding:0 16px}
  nav{padding:0 16px}
  #patient-bar{padding:8px 16px;gap:14px}
  .g2-fixed{grid-template-columns:1fr}
  .logo-sub{display:none}
}
</style>
</head>
<body>
<div id="app">

<!-- TOAST -->
<div id="toast-wrap"></div>

<!-- VOICE MODAL -->
<div id="voice-modal">
  <div class="vm-wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div style="flex:1">
    <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Thalita está falando...</div>
    <div id="vm-text" style="font-size:13px;font-weight:500;color:var(--text)">...</div>
  </div>
  <button class="btn btn-ghost btn-sm" onclick="VOICE.stop()">✕</button>
</div>

<!-- ══ HEADER ══════════════════════════════════════════════════════════ -->
<header>
  <a class="logo" href="#">
    <div class="logo-icon">🫀</div>
    <div>
      <div class="logo-text">ChronoSaúde</div>
      <div class="logo-sub">Monitor Inteligente</div>
    </div>
  </a>

  <div class="header-right">
    <div class="clock-pill" id="clock">00:00:00</div>

    <!-- Sound toggle -->
    <button class="icon-btn active" id="sound-btn" title="Som (ativo)" onclick="toggleSound()">🔊</button>

    <!-- Theme toggle -->
    <button class="icon-btn" id="theme-btn" title="Alternar tema" onclick="toggleTheme()">🌙</button>

    <!-- Voice schedule button -->
    <button class="icon-btn" id="voice-btn" title="Ouvir cronograma" onclick="VOICE.readSchedule()">📢</button>

    <!-- User chip -->
    <div class="user-chip" onclick="logout()">
      <div class="user-avatar" id="user-avatar">M</div>
      <div class="user-name" id="user-name-chip">Usuário</div>
    </div>
  </div>
</header>

<!-- ══ PATIENT INFO BAR ════════════════════════════════════════════════ -->
<div id="patient-bar">

/* ══ VOICE ENGINE (Thalita) ══════════════════════════════════════ */
const VOICE = (() => {
  let synth = window.speechSynthesis;
  let thalita = null;
  let speaking = false;

  function loadVoices(){
    const voices = synth.getVoices();
    // Priority: Thalita → Microsoft Maria → any pt-BR → first
    thalita = voices.find(v=>v.name.toLowerCase().includes('thalita'))
           || voices.find(v=>v.name.toLowerCase().includes('maria') && v.lang.startsWith('pt'))
           || voices.find(v=>v.lang==='pt-BR')
           || voices.find(v=>v.lang.startsWith('pt'))
           || voices[0];
  }

  if(synth.onvoiceschanged !== undefined){ synth.onvoiceschanged = loadVoices; }
  loadVoices();
  setTimeout(loadVoices, 500);

  function speak(text, cb){
    if(!S.soundOn){ if(cb)cb(); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(thalita) u.voice = thalita;
    u.lang = 'pt-BR';
    u.rate = 0.95;
    u.pitch = 1.05;
    u.volume = 1;
    u.onstart = ()=>{
      speaking = true;
      showModal(text);
    };
    u.onend = u.onerror = ()=>{
      speaking = false;
      hideModal();
      if(cb)cb();
    };
    synth.speak(u);
  }

  function stop(){
    synth.cancel();
    speaking = false;
    hideModal();
  }

  function showModal(text){
    const m = document.getElementById('voice-modal');
    document.getElementById('vm-text').textContent = text;
    m.classList.add('show');
  }
  function hideModal(){
    document.getElementById('voice-modal').classList.remove('show');
  }

  function greet(){
    const h = new Date().getHours();
    const g = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
    const name = S.user.split(' ')[0];
    const adh = medAdherence();
    const meds = nextMeds(2);
    let msg = `${g}, ${name}! Bem-vinda ao ChronoSaúde. `;
    msg += `Sua adesão ao tratamento hoje está em ${adh} por cento. `;
    if(meds.length>0){
      msg += `Você tem ${meds.length === 1 ? 'um medicamento' : meds.length + ' medicamentos'} programados para hoje. `;
      msg += `O próximo é ${meds[0].name}, ${meds[0].dose}, às ${meds[0].time}. `;
    }
    msg += `Cuide-se bem!`;
    speak(msg);
  }

  function readSchedule(){
    const today = S.now.toDateString();
    const meds = S.meds.flatMap(m=>m.times.map(t=>({...m,time:t,taken:!!m.taken[`${today}-${t}`]})))
                       .sort((a,b)=>a.time.localeCompare(b.time));
    if(meds.length===0){ speak('Você não tem medicamentos programados para hoje.'); return; }
    let msg = 'Seu cronograma de medicamentos para hoje: ';
    meds.forEach(m=>{
      msg += `${m.name}, ${m.dose}, às ${m.time.replace(':',' horas e ')}, ${m.taken?'já tomado.':'ainda não tomado.'} `;
    });
    speak(msg);
  }

  function alertMed(medName, dose, time){
    speak(`Atenção! Está na hora de tomar ${medName}, ${dose}. Horário: ${time.replace(':',' horas e ')}.`);
  }

  function alertVital(label, value, unit, level){
    const l = level==='danger'?'crítico':'de atenção';
    speak(`Alerta ${l}! ${label} está em ${value} ${unit}. Por favor, verifique com seu médico.`);
  }

  function readAlerts(){
    const unread = S.alerts.filter(a=>!a.read);
    if(unread.length===0){ speak('Você não tem alertas pendentes no momento.'); return; }
    speak(`Você tem ${unread.length} ${unread.length===1?'alerta':'alertas'} não lido${unread.length===1?'':'s'}. ${unread[0].title}. ${unread[0].desc}`);
  }

  return { greet, speak, stop, readSchedule, alertMed, alertVital, readAlerts };
})();

/* ── Audio alarm (Web Audio API) ─────────────────────────────────── */
function playAlarmBeep(type='med'){
  if(!S.soundOn) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const freqs = type==='danger'?[880,660,880]:type==='warn'?[660,550]:type==='med'?[523,659,784]:[440];
    let t = ctx.currentTime;
    freqs.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const gain= ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(f,t+i*0.12);
      gain.gain.setValueAtTime(0,t+i*0.12);
      gain.gain.linearRampToValueAtTime(0.3,t+i*0.12+0.02);
      gain.gain.linearRampToValueAtTime(0,t+i*0.12+0.18);
      osc.start(t+i*0.12); osc.stop(t+i*0.12+0.2);
    });
  }catch(e){}
}

/* ── Helpers ─────────────────────────────────────────────────────── */
function medAdherence(){
  const today=S.now.toDateString(); let total=0,taken=0;
  S.meds.forEach(m=>{m.times.forEach(t=>{total++;if(m.taken[`${today}-${t}`])taken++;});});
  return total===0?0:Math.round((taken/total)*100);
}
function nextMeds(n=4){
  const today=S.now.toDateString();
  return S.meds.flatMap(m=>m.times.map(t=>({...m,time:t,taken:!!m.taken[`${today}-${t}`]}))).sort((a,b)=>a.time.localeCompare(b.time)).slice(0,n);
}
function vStatus(key,val){
  if(key==='hr')     return val<60||val>100?(val<50||val>120?'danger':'warn'):'ok';
  if(key==='spo2')   return val<94?'danger':val<96?'warn':'ok';
  if(key==='bp')     return val>160?'danger':val>140?'warn':'ok';
  if(key==='temp')   return val>38.5?'danger':val>37.5?'warn':'ok';
  if(key==='glucose')return val>200?'danger':val>140?'warn':'ok';
  return 'ok';
}
function vsCls(k,v){const s=vStatus(k,v);return s==='ok'?'b-ok':s==='warn'?'b-warn':'b-danger';}
function vsLbl(k,v){const s=vStatus(k,v);return s==='ok'?'Normal':s==='warn'?'Atenção':'Crítico';}
function bmi(){return (S.weight/(S.height/100)**2).toFixed(1);}
function bmiLabel(b){return b<18.5?'Abaixo do peso':b<25?'Normal':b<30?'Sobrepeso':b<35?'Obesidade I':b<40?'Obesidade II':'Obesidade III';}
function bmiClass(b){return b<18.5?'b-warn':b<25?'b-ok':b<30?'b-warn':'b-danger';}
function nowStr(){const d=new Date();return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function fmtSync(){if(!S.watch.lastSync)return'nunca';const s=Math.round((Date.now()-S.watch.lastSync)/1e3);return s<60?`há ${s}s`:`há ${Math.round(s/60)}min`;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function rnd(lo,hi){return lo+Math.random()*(hi-lo);}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function glcLbl(v){return v>200?'Hiperglicemia':v>140?'Elevada':v<70?'Hipoglicemia':'Normal';}
function glcCls(v){return v>200?'b-danger':v>140?'b-warn':v<70?'b-danger':'b-ok';}

/* ── Toast ───────────────────────────────────────────────────────── */
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span>${type==='danger'?'🚨':type==='warn'?'⚠️':type==='info'?'ℹ️':'✓'}</span>${msg}`;
  el.onclick=()=>el.remove();
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},5000);
}

function addAlert(title,desc,type='info'){
  S.alerts.unshift({title,desc,type,time:new Date().toLocaleTimeString('pt-BR'),read:false,id:Date.now()});
  renderBadges();
}

/* ── Render engine ───────────────────────────────────────────────── */
function render(){
  renderNav();
  renderMain();
  renderBars();
}
function renderBars(){
  setText('adh-val', medAdherence()+'%');
  setText('water-val', `${S.waterCups} / 8 copos`);
  setText('pbar-name', S.user);
  // User chip
  document.getElementById('user-avatar').textContent = S.user.charAt(0).toUpperCase();
  document.getElementById('user-name-chip').textContent = S.user.split(' ')[0];
  // Watch pill
  const wd = document.getElementById('wd');
  const ws = document.getElementById('ws-lbl');
  if(S.watchConnecting){wd.style.background='var(--warn)';wd.style.animation='pulse .6s infinite';ws.textContent='⌚ conectando...';}
  else if(S.watchConnected){wd.style.background='var(--g1)';wd.style.animation='pulse 1.2s infinite';ws.textContent='⌚ Apple Watch • ao vivo';}
  else{wd.style.background='var(--muted2)';wd.style.animation='none';ws.textContent='⌚ Smartwatch desconectado';}
}
function renderBadges(){
  const unread = S.alerts.filter(a=>!a.read).length;
  document.querySelectorAll('.alert-badge').forEach(b=>{
    b.textContent=unread;b.style.display=unread?'inline':'none';
  });
}
function renderNav(){
  const tabs = TABS[S.view];
  const unread = S.alerts.filter(a=>!a.read).length;
  document.getElementById('nav').innerHTML = [
    ...tabs.map(t=>`<button class="tab-btn${S.tab===t.id?' active':''}" onclick="setTab('${t.id}')">${t.icon} ${t.label}${(t.id==='alerts_doc'&&unread)?`<span class="tab-badge alert-badge">${unread}</span>`:''}</button>`),
    `<button class="tab-btn${S.view==='doctor'?' active':''}" style="margin-left:auto" onclick="setView('${S.view==='patient'?'doctor':'patient'}')">${S.view==='patient'?'👨‍⚕️ Visão Médico':'👤 Visão Paciente'}</button>`
  ].join('');
}
function renderMain(){
  const pages = {
    dashboard,watch:pageWatch,vitals:pageVitals,meds:pageMeds,symptoms:pageSymptoms,
    wellness:pageWellness,appointments:pageAppointments,
    overview:pageOverview,trends:pageTrends,alerts_doc:pageAlerts,rx:pageRx,emergency:pageEmergency
  };
  document.getElementById('main').innerHTML = (pages[S.tab]||pageDashboard)();
  afterRender();
}
function afterRender(){
  document.querySelectorAll('[data-chart]').forEach(c=>{
    try{const cfg=JSON.parse(c.dataset.chart);drawChart(c,cfg.data,cfg.color,cfg.fill!==false);}catch(e){}
  });
}
function setView(v){
  S.view=v;S.tab=TABS[v][0].id;render();
}
function setTab(t){
  S.tab=t;render();
}
function logout(){
  if(confirm('Sair do ChronoSaúde?')){
    sessionStorage.clear();window.location.href='index.html';
  }
}
function handleWatchClick(){
  if(S.watchConnecting)return;
  if(S.watchConnected)disconnectWatch();
  else{setTab('watch');}
}

/* helper — SVG sparkline inline (sem canvas) */
function sparkSVG(data, color, w=120, h=36){
  if(!data||data.length<2) return '';
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*(h-4)-2}`).join(' ');
  const area=`M0,${h} L${pts.split(' ').join(' L')} L${w},${h} Z`;
  const id=`sg${Math.random().toString(36).slice(2,7)}`;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;flex-shrink:0">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".3"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${(data.length-1)/(data.length-1)*w}" cy="${h-((data[data.length-1]-mn)/rng)*(h-4)-2}" r="3" fill="${color}"/>
  </svg>`;
}

/* helper — full VitalCard com sparkline SVG, trend arrow, badge */
function docVitalCard(icon, label, value, unit, hist, color, vkey){
  const st = vStatus(vkey, typeof value==='number'?value:hist[hist.length-1]);
  const cls = st==='ok'?'b-ok':st==='warn'?'b-warn':'b-danger';
  const lbl = st==='ok'?'Normal':st==='warn'?'Atenção':'Crítico';
  const prev = hist.length>=2 ? hist[hist.length-2] : hist[0];
  const curr = hist[hist.length-1];
  const delta = +(curr-prev).toFixed(1);
  const arrow = delta>0?`<span style="color:var(--danger);font-size:12px">↑${delta}</span>`
               :delta<0?`<span style="color:var(--g1);font-size:12px">↓${Math.abs(delta)}</span>`
               :`<span style="color:var(--muted);font-size:12px">→</span>`;
  return`<div class="vital-card" style="gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:20px">${icon}</div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px">${label}</div></div>
      <span class="badge ${cls}">${lbl}</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:6px">
      <span style="font-family:var(--font-hd);font-size:26px;font-weight:800;color:${color};line-height:1">${value}</span>
      <span style="font-size:11px;color:var(--muted);margin-bottom:3px">${unit}</span>
      ${arrow}
    </div>
    ${sparkSVG(hist, color, 120, 36)}
  </div>`;
}

/* helper — efficacy row com sparkline */
function efficacyRow(icon, label, hist, unit, vkey, avail){
  if(!avail||!hist||hist.length<4)
    return`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);opacity:.35">
      <span style="font-size:20px;width:28px;text-align:center">${icon}</span>
      <span style="font-size:13px;font-weight:500;width:160px;flex-shrink:0">${label}</span>
      <span style="font-size:11px;color:var(--muted)">Dados insuficientes — conecte o smartwatch</span>
    </div>`;
  const first3 = hist.slice(0,3).reduce((a,b)=>a+b,0)/3;
  const last3  = hist.slice(-3).reduce((a,b)=>a+b,0)/3;
  const delta  = +(last3-first3).toFixed(1);
  const st     = vStatus(vkey, hist[hist.length-1]);
  const imp    = (vkey==='hr'||vkey==='bp'||vkey==='glucose')? delta<0 : delta>0;
  const barPct = Math.min(96, Math.max(8, Math.abs(delta/(first3||1))*200+50));
  const barCol = imp?'linear-gradient(90deg,var(--g1),var(--g2))':'linear-gradient(90deg,var(--warn),var(--danger))';
  const dCol   = imp?'var(--g1)':'var(--warn)';
  const stCls  = st==='ok'?'b-ok':st==='warn'?'b-warn':'b-danger';
  const stLbl  = st==='ok'?'Bom':st==='warn'?'Atenção':'Crítico';
  return`<div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)">
    <span style="font-size:20px;width:28px;text-align:center">${icon}</span>
    <span style="font-size:13px;font-weight:600;width:160px;flex-shrink:0">${label}</span>
    <div style="flex:1;min-width:60px">
      <div class="prog-wrap" style="height:8px"><div class="prog-bar" style="width:${barPct}%;background:${barCol}"></div></div>
    </div>
    <span class="badge ${stCls}" style="width:70px;text-align:center;justify-content:center">${stLbl}</span>
    <span style="font-family:var(--font-mono);font-size:12px;width:72px;text-align:right;color:${dCol}">${delta>0?'+':''}${delta} ${unit}</span>
    ${sparkSVG(hist, imp?'#00e5b8':'#f59e0b', 100, 30)}
  </div>`;
}

/* helper — gera insights clínicos dinâmicos baseados nos dados */
function genInsights(){
  const g=S.vitals.glucose; const w=S.watch;
  const gAvg=Math.round(g.history.reduce((a,b)=>a+b,0)/g.history.length);
  const bpAvg=S.watchConnected?Math.round(w.bpHistory.reduce((a,b)=>a+b,0)/w.bpHistory.length):0;
  const adh=medAdherence();
  const sinv=S.meds.find(m=>m.name==='Sinvastatina');
  const losa=S.meds.find(m=>m.name==='Losartana');
  const items=[];

  if(gAvg>140) items.push({dot:'var(--warn)',title:'Glicose acima da meta terapêutica',body:`Média de ${gAvg} mg/dL (meta: 70–140). ${adh<70?'Baixa adesão pode estar contribuindo.':'Considere ajuste na dose de Metformina ou revisão da dieta.'}`});
  else items.push({dot:'var(--g1)',title:'Controle glicêmico adequado',body:`Média de ${gAvg} mg/dL dentro da faixa-alvo. Manter Metformina na dose atual.`});

  if(S.watchConnected){
    if(bpAvg>140) items.push({dot:'var(--warn)',title:'Pressão média elevada',body:`Média de ${bpAvg} mmHg. Losartana pode precisar de reforço ou troca para IECA.`});
    else items.push({dot:'var(--g1)',title:'Pressão sob controle',body:`Média de ${bpAvg} mmHg. Losartana ${losa?.dose} demonstra eficácia. Manter esquema atual.`});

    if(w.hrv<35) items.push({dot:'var(--warn)',title:'HRV baixo — risco cardiovascular',body:`HRV de ${w.hrv}ms sugere alta carga de estresse ou recuperação insuficiente. Considere avaliação cardiológica.`});
    else items.push({dot:'var(--g1)',title:'HRV adequado',body:`HRV de ${w.hrv}ms indica boa variabilidade cardíaca. Sem necessidade de intervenção imediata.`});
  }

  if(sinv){
    const dias=Math.floor(sinv.stock/sinv.times.length);
    if(dias<=7) items.push({dot:'var(--danger)',title:`Estoque crítico: Sinvastatina`,body:`Apenas ${dias} dias restantes. Emitir nova prescrição antes da próxima consulta.`});
  }

  if(adh<70) items.push({dot:'var(--danger)',title:'Adesão medicamentosa crítica',body:`Apenas ${adh}% de adesão hoje. Risco de descompensação. Considere telemonitoramento ativo.`});
  else if(adh<90) items.push({dot:'var(--warn)',title:'Adesão parcial ao tratamento',body:`${adh}% de adesão. Reforçar orientações na próxima consulta.`});

  return items.map((item,i)=>`<div style="display:flex;gap:13px;padding:13px 0;border-bottom:${i<items.length-1?'1px solid var(--border)':'none'}">
    <div style="width:8px;height:8px;border-radius:50%;background:${item.dot};margin-top:5px;flex-shrink:0"></div>
    <div><div style="font-weight:600;font-size:13px;margin-bottom:3px">${item.title}</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6">${item.body}</div></div>
  </div>`).join('');
}

function takeMed(id,time){
  const today=S.now.toDateString();
  const med=S.meds.find(m=>m.id===id);
  if(!med)return;
  med.taken[`${today}-${time}`]=true;
  med.stock=Math.max(0,med.stock-1);
  playAlarmBeep('med');
  VOICE.speak(`${med.name} ${med.dose} registrado como tomado!`);
  toast(`💊 ${med.name} marcado como tomado ✓`,'ok');
  render();
}
function addGlucose(){
  const val=parseFloat(document.getElementById('inp-gluc')?.value);
  if(isNaN(val)||val<20||val>700){toast('Valor inválido','warn');return;}
  S.vitals.glucose.history=[...S.vitals.glucose.history.slice(-9),val];
  S.vitals.glucose.value=val;

  if(st==='danger'){playAlarmBeep('danger');VOICE.alertVital('Glicose',val,'miligramas por decilitro','danger');addAlert(`Glicose crítica: ${val} mg/dL`,'Valor acima de 200 mg/dL.','danger');toast(`🚨 Glicose CRÍTICA: ${val} mg/dL`,'danger');}

  else{VOICE.speak(`Glicose registrada: ${val} miligramas por decilitro. Normal.`);toast('🩸 Glicose registrada','ok');}
  render();
}

/* ── Realtime watch simulation ──────────────────────────────────── */
function tickWatch(){
  if(!S.watchConnected)return;
  const w=S.watch;
  w.hr   = clamp(w.hr   +rnd(-1.5,1.5)|0, 50, 120);
  w.spo2 = clamp(+(w.spo2+rnd(-.2,.2)).toFixed(1), 93, 100);
  w.hrv  = clamp(w.hrv  +(rnd(-1.5,1.5)|0), 20, 80);
  w.bp_sys=clamp(w.bp_sys+(rnd(-1.5,1.5)|0), 100, 185);
  w.temp = clamp(+(w.temp+rnd(-.04,.04)).toFixed(1), 35.5, 39.5);
  w.steps+=(Math.random()*6)|0;
  w.hrHistory  =[...w.hrHistory.slice(-59),  w.hr];
  w.spo2History=[...w.spo2History.slice(-59), w.spo2];
  w.bpHistory  =[...w.bpHistory.slice(-59),  w.bp_sys];
  w.lastSync=Date.now();

  // Spot-update DOM
  setText('wf-hr',w.hr);setText('wf-hr2',w.hr);
  setText('wf-spo2',w.spo2+'%');setText('wf-spo2b',w.spo2+'%');
  setText('wf-hrv2',w.hrv+'ms');setText('wf-steps',w.steps.toLocaleString('pt-BR'));
  setText('sync-lbl',fmtSync());setText('sync2',fmtSync());
  setText('hrv-val',w.hrv);

  // Threshold alerts with voice
  if(w.spo2<94&&Math.random()<.08){
    playAlarmBeep('warn');VOICE.alertVital('SpO₂',w.spo2,'por cento','warn');
    addAlert('SpO₂ baixa',`Saturação ${w.spo2}%.`,'warn');
  }
  if(w.bp_sys>165&&Math.random()<.05){
    playAlarmBeep('danger');VOICE.alertVital('Pressão arterial',w.bp_sys,'milímetros de mercúrio','danger');
    addAlert('Pressão crítica',`Sistólica ${w.bp_sys} mmHg.`,'danger');
  }
  if(w.hr>115&&Math.random()<.06){
    toast(`❤️ FC elevada: ${w.hr} bpm`,'warn');
  }

  // Redraw charts
  document.querySelectorAll('[data-chart]').forEach(c=>{
    try{
      const cfg=JSON.parse(c.dataset.chart);
      let d=cfg.data;
      if(cfg.color==='#ef4444')d=w.hrHistory;
      else if(cfg.color==='#00e5b8')d=w.spo2History;
      else if(cfg.color==='#0ea5e9')d=w.bpHistory;
      drawChart(c,d,cfg.color,cfg.fill!==false);
    }catch(e){}
  });
}

/* ── Clock & med alarms ─────────────────────────────────────────── */
function tickClock(){
  S.now=new Date();
  const h=String(S.now.getHours()).padStart(2,'0');
  const m=String(S.now.getMinutes()).padStart(2,'0');
  const s=String(S.now.getSeconds()).padStart(2,'0');
  setText('clock',`${h}:${m}:${s}`);
  document.querySelectorAll('.watch-time').forEach(e=>e.textContent=`${h}:${m}`);

  // Med reminders — every minute
  if(s==='00'){
    const t=`${h}:${m}`;
    const today=S.now.toDateString();
    S.meds.forEach(med=>{
      med.times.forEach(mt=>{
        const key=`${today}-${mt}-alerted`;
        if(mt===t&&!med.taken[`${today}-${mt}`]&&!S.medAlertedToday[key]){
          S.medAlertedToday[key]=true;
          playAlarmBeep('med');
          VOICE.alertMed(med.name,med.dose,mt);
          addAlert(`Medicamento: ${med.name}`,`Hora de tomar ${med.dose} às ${mt}.`,'info');
          toast(`⏰ ${med.name} ${med.dose} — hora de tomar!`,'warn');
        }
      });
    });
    // Water reminder every 2h
    if(m==='00'&&[8,10,12,14,16,18,20,22].includes(parseInt(h))&&S.waterCups<8){
      VOICE.speak('Lembrete: tome um copo de água. Você está com boa hidratação hoje.');
    }
  }
}

/* ── Canvas chart ───────────────────────────────────────────────── */
function drawChart(canvas,data,color,fill=true){
  if(!data||data.length<2)return;
  const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth||canvas.parentElement?.offsetWidth||300;
  const h=canvas.offsetHeight||130;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const p={t:6,r:6,b:18,l:32};
  const cw=w-p.l-p.r,ch=h-p.t-p.b;
  const mn=Math.min(...data)-1,mx=Math.max(...data)+1,rng=mx-mn||1;
  ctx.strokeStyle='rgba(128,128,128,.06)';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=p.t+ch*(1-i/3);ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(p.l+cw,y);ctx.stroke();ctx.fillStyle='rgba(128,128,128,.3)';ctx.font=`9px DM Mono`;ctx.textAlign='right';ctx.fillText((mn+rng*(i/3)).toFixed(0),p.l-3,y+3);}
  const pts=data.map((v,i)=>({x:p.l+(i/(data.length-1))*cw,y:p.t+ch*(1-((v-mn)/rng))}));
  if(fill){const g=ctx.createLinearGradient(0,p.t,0,p.t+ch);g.addColorStop(0,color+'55');g.addColorStop(1,color+'00');ctx.beginPath();ctx.moveTo(pts[0].x,p.t+ch);pts.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.lineTo(pts[pts.length-1].x,p.t+ch);ctx.closePath();ctx.fillStyle=g;ctx.fill();}
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){const mx=(pts[i-1].x+pts[i].x)/2;ctx.bezierCurveTo(mx,pts[i-1].y,mx,pts[i].y,pts[i].x,pts[i].y);}
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  const lp=pts[pts.length-1];ctx.beginPath();ctx.arc(lp.x,lp.y,4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.beginPath();ctx.arc(lp.x,lp.y,7,0,Math.PI*2);ctx.fillStyle=color+'33';ctx.fill();
}

/* ── Bootstrap ──────────────────────────────────────────────────── */
render();
setInterval(tickClock,1000);
setInterval(tickWatch,2000);

// Greet after 800ms (let page load first)
setTimeout(()=>{ VOICE.greet(); }, 800);
</script>
