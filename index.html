<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ChronoSaúde — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06090f;--card:#0f1923;--border:#1a2535;--g1:#00e5b8;--g2:#0ea5e9;--text:#dde8f5;--muted:#4d6680;--danger:#ef4444;}
[data-theme="light"]{--bg:#f0f4f8;--card:#ffffff;--border:#d1dce8;--text:#1a2535;--muted:#6b7f96;}
html,body{height:100%;font-family:'Instrument Sans',sans-serif}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .3s;position:relative;overflow:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.12;animation:drift 18s ease-in-out infinite alternate;}
.blob1{width:600px;height:600px;background:var(--g1);top:-200px;left:-200px;animation-delay:0s}
.blob2{width:500px;height:500px;background:var(--g2);bottom:-150px;right:-150px;animation-delay:-6s}
.blob3{width:350px;height:350px;background:#a78bfa;top:40%;left:60%;animation-delay:-12s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.08)}}
.theme-btn{position:fixed;top:18px;right:18px;background:var(--card);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .2s;z-index:10;}
.theme-btn:hover{transform:scale(1.1);border-color:var(--g1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px 40px;width:100%;max-width:420px;position:relative;z-index:2;backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,.3);animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:36px}
.logo-heart{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;animation:pulse-hb 2s ease-in-out infinite;}
@keyframes pulse-hb{0%,100%{box-shadow:0 0 20px rgba(0,229,184,.3)}50%{box-shadow:0 0 50px rgba(0,229,184,.6)}}
.logo-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:13px;color:var(--muted);margin-top:4px}
.form-group{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
.input-wrap{position:relative}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 44px 12px 16px;font-family:'Instrument Sans',sans-serif;font-size:15px;outline:none;transition:border .2s,box-shadow .2s;}
input:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(0,229,184,.12)}
.input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;cursor:pointer;color:var(--muted);transition:color .2s;background:none;border:none;padding:0;}
.input-icon:hover{color:var(--g1)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--danger);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;align-items:center;gap:8px;}
.btn-login{width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#000;border:none;border-radius:10px;padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,229,184,.3)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{width:18px;height:18px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.login-note{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
.login-note a{color:var(--g1);text-decoration:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease both}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<button class="theme-btn" id="theme-btn" title="Alternar tema">🌙</button>
<div class="card" id="login-card">
  <div class="logo">
    <div class="logo-heart">🫀</div>
    <div class="logo-title">ChronoSaúde</div>
    <div class="logo-sub">Monitor Inteligente de Doenças Crônicas</div>
  </div>
  <div id="error-box" class="error-msg">
    <span>🔒</span><span id="error-text">Senha incorreta. Tente novamente.</span>
  </div>
  <div class="form-group">
    <label for="inp-name">Seu nome</label>
    <div class="input-wrap">
      <input type="text" id="inp-name" placeholder="Ex: Maria Santos" autocomplete="name"/>
      <span class="input-icon">👤</span>
    </div>
  </div>
  <div class="form-group">
    <label for="inp-password">Senha de acesso</label>
    <div class="input-wrap">
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="input-icon" id="eye-btn" type="button" title="Mostrar/ocultar senha">👁️</button>
    </div>
  </div>
  <button class="btn-login" id="login-btn" type="button">
    <span id="btn-text">Entrar no sistema</span>
    <div class="spinner" id="spinner"></div>
  </button>
  <p class="login-note">
    Não tem acesso? Contate seu médico responsável.<br/>
    <a href="mailto:suporte@chronosaude.com.br">suporte@chronosaude.com.br</a>
  </p>
</div>
<script>
// ── Senha padrão — altere aqui ou crie config.js com: window.APP_CONFIG = { senha: "sua_senha" }
var SENHA_PADRAO = 'Unimed262';

// ── Tema
var savedTheme = localStorage.getItem('cs-theme') || 'dark';
document.documentElement.dataset.theme = savedTheme;
document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('theme-btn').addEventListener('click', function(){
  var curr = document.documentElement.dataset.theme;
  var next = curr === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('cs-theme', next);
  this.textContent = next === 'dark' ? '🌙' : '☀️';
});

// ── Olho
document.getElementById('eye-btn').addEventListener('click', function(){
  var inp = document.getElementById('inp-password');
  if(inp.type === 'password'){ inp.type = 'text'; this.textContent = '🙈'; }
  else { inp.type = 'password'; this.textContent = '👁️'; }
});

// ── Enter
document.getElementById('inp-password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('inp-name').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('inp-password').focus(); });
document.getElementById('login-btn').addEventListener('click', doLogin);

// ── Login
async function doLogin(){
  var name    = document.getElementById('inp-name').value.trim();
  var pass    = document.getElementById('inp-password').value;
  var errBox  = document.getElementById('error-box');
  var errTxt  = document.getElementById('error-text');
  var btn     = document.getElementById('login-btn');
  var spinner = document.getElementById('spinner');
  var btnTxt  = document.getElementById('btn-text');
  var card    = document.getElementById('login-card');

  function showErr(msg){
    errTxt.textContent = msg;
    errBox.style.display = 'flex';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    setTimeout(function(){ card.classList.remove('shake'); }, 400);
  }

  errBox.style.display = 'none';
  if(!name){ showErr('Por favor, informe seu nome.'); document.getElementById('inp-name').focus(); return; }
  if(!pass){ showErr('Por favor, informe a senha.');  document.getElementById('inp-password').focus(); return; }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnTxt.textContent = 'Verificando...';

  await new Promise(function(r){ setTimeout(r, 900); });

  var expectedPass = (window.APP_CONFIG && window.APP_CONFIG.senha) ? window.APP_CONFIG.senha : SENHA_PADRAO;

  if(pass !== expectedPass){
    btn.disabled = false;
    spinner.style.display = 'none';
    btnTxt.textContent = 'Entrar no sistema';
    document.getElementById('inp-password').value = '';
    document.getElementById('inp-password').focus();
    showErr('Senha incorreta. Verifique e tente novamente.');
    return;
  }

  btnTxt.textContent = '✓ Entrando...';
  sessionStorage.setItem('cs-auth', '1');
  sessionStorage.setItem('cs-user', name);
  card.style.transition = 'opacity .4s, transform .4s';
  card.style.opacity = '0';
  card.style.transform = 'translateY(-20px) scale(.97)';
  setTimeout(function(){ window.location.href = 'app.html'; }, 500);
}

document.getElementById('inp-name').focus();
</script>
</body>
</html>
